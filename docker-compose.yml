services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webtester-app
    ports:
      - "9090:9090"
    environment:
      - HTTP_ADDR=:9090
      - DB_PATH=/data/webtester.db
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - ZAP_IMAGE=ghcr.io/zaproxy/zaproxy:stable
      - ZAP_TIMEOUT_SECONDS=1800
    volumes:
      - webtester-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: webtester-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  webtester-data:
  redis-data: