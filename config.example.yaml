http_addr: ":9090"

database:
  path: "webtester.db"

zap:
  image: "ghcr.io/zaproxy/zaproxy:stable"
  timeout_seconds: 1800

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

auth:
  access_secret: ""          # Set via AUTH_ACCESS_SECRET env var
  refresh_secret: ""         # Set via AUTH_REFRESH_SECRET env var
  access_ttl: "15m"
  refresh_ttl: "168h"