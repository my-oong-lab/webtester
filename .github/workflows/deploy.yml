name: Deploy Webtester

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Container image version to deploy (must exist from Build workflow)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Verify image exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if ! podman image exists "webtester:${VERSION}"; then
            echo "::error::Image 'webtester:${VERSION}' not found in local Podman storage."
            echo "Run the 'Build Webtester' workflow first with the same version."
            exit 1
          fi

          echo "Image webtester:${VERSION} exists."

      - name: Generate config.yaml from GitHub Variables & Secrets
        env:
          CONFIG_VERSION: ${{ inputs.version }}
          CONFIG_HTTP_ADDR: ${{ vars.HTTP_ADDR }}
          CONFIG_DB_PATH: ${{ vars.DB_PATH }}
          CONFIG_ZAP_IMAGE: ${{ vars.ZAP_IMAGE }}
          CONFIG_ZAP_TIMEOUT: ${{ vars.ZAP_TIMEOUT_SECONDS }}
          CONFIG_ZAP_RUNTIME: ${{ vars.ZAP_RUNTIME }}
          CONFIG_REDIS_ADDR: ${{ vars.REDIS_ADDR }}
          CONFIG_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          CONFIG_REDIS_DB: ${{ vars.REDIS_DB }}
          CONFIG_AUTH_ACCESS_SECRET: ${{ secrets.AUTH_ACCESS_SECRET }}
          CONFIG_AUTH_REFRESH_SECRET: ${{ secrets.AUTH_REFRESH_SECRET }}
          CONFIG_AUTH_ACCESS_TTL: ${{ vars.AUTH_ACCESS_TTL }}
          CONFIG_AUTH_REFRESH_TTL: ${{ vars.AUTH_REFRESH_TTL }}
        run: |
          set -euo pipefail

          python3 -c "
          import os, json

          def q(v):
              return json.dumps(str(v))

          def get_env(key, default):
              v = os.environ.get(key, '')
              return default if v == '' else v

          timeout = 1800
          try:
              timeout = int(get_env('CONFIG_ZAP_TIMEOUT', '1800'))
          except ValueError:
              pass

          redis_db = 0
          try:
              redis_db = int(get_env('CONFIG_REDIS_DB', '0'))
          except ValueError:
              pass

          lines = [
              'version: ' + q(get_env('CONFIG_VERSION', '1.0.0')),
              'http_addr: ' + q(get_env('CONFIG_HTTP_ADDR', ':9090')),
              '',
              'database:',
              '  path: ' + q(get_env('CONFIG_DB_PATH', '/data/webtester.db')),
              '',
              'zap:',
              '  image: ' + q(get_env('CONFIG_ZAP_IMAGE', 'ghcr.io/zaproxy/zaproxy:stable')),
              '  timeout_seconds: ' + str(timeout),
              '  runtime: ' + q(get_env('CONFIG_ZAP_RUNTIME', 'podman')),
              '',
              'redis:',
              '  addr: ' + q(get_env('CONFIG_REDIS_ADDR', 'redis:6379')),
              '  password: ' + q(get_env('CONFIG_REDIS_PASSWORD', '')),
              '  db: ' + str(redis_db),
              '',
              'auth:',
              '  access_secret: ' + q(get_env('CONFIG_AUTH_ACCESS_SECRET', '')),
              '  refresh_secret: ' + q(get_env('CONFIG_AUTH_REFRESH_SECRET', '')),
              '  access_ttl: ' + q(get_env('CONFIG_AUTH_ACCESS_TTL', '15m')),
              '  refresh_ttl: ' + q(get_env('CONFIG_AUTH_REFRESH_TTL', '168h')),
          ]

          with open('config.yaml', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          "

      - name: Deploy with Podman Compose
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          APP_VERSION: ${{ inputs.version }}
          HTTP_ADDR: ${{ vars.HTTP_ADDR }}
          DB_PATH: ${{ vars.DB_PATH }}
          REDIS_ADDR: ${{ vars.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_DB: ${{ vars.REDIS_DB }}
          ZAP_IMAGE: ${{ vars.ZAP_IMAGE }}
          ZAP_TIMEOUT_SECONDS: ${{ vars.ZAP_TIMEOUT_SECONDS }}
          ZAP_RUNTIME: ${{ vars.ZAP_RUNTIME }}
          AUTH_ACCESS_SECRET: ${{ secrets.AUTH_ACCESS_SECRET }}
          AUTH_REFRESH_SECRET: ${{ secrets.AUTH_REFRESH_SECRET }}
          AUTH_ACCESS_TTL: ${{ vars.AUTH_ACCESS_TTL }}
          AUTH_REFRESH_TTL: ${{ vars.AUTH_REFRESH_TTL }}
        run: |
          set -euo pipefail

          echo "Runtime directory: $XDG_RUNTIME_DIR"
          test -S "$XDG_RUNTIME_DIR/podman/podman.sock"

          # Validate the resolved Compose configuration.
          podman-compose config

          # Ensure Redis is running without explicitly removing its container.
          podman-compose up -d redis

          # Reconcile Podman's recorded container states with the runtime.
          podman ps --sync -a

          # Replace only the application container; preserve volumes and other services.
          podman rm -f webtester-app

          # Start the application with the current Compose configuration.
          podman-compose up -d --no-deps app

          echo "Application container recreated."

      - name: Verify container health
        env:
          XDG_RUNTIME_DIR: /run/user/1000
        run: |
          set -euo pipefail

          healthy=false

          for i in $(seq 1 30); do
            running=false
            process_ok=false

            # Confirm Podman reports the container as running.
            if [ "$(podman inspect \
              --format '{{.State.Running}}' webtester-app 2>/dev/null || true)" = "true" ]; then
              running=true
            fi

            # Confirm the container process and HTTP endpoint work.
            if [ "$running" = true ] &&
               podman top webtester-app >/dev/null 2>&1 &&
               curl -fsS --max-time 3 \
                 http://127.0.0.1:9090/healthz >/dev/null; then
              process_ok=true
            fi

            if [ "$process_ok" = true ]; then
              healthy=true
              break
            fi

            echo "Waiting for Webtester health check ($i/30)..."
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "::error::Webtester failed its process or HTTP health check."

            echo "### Container status"
            podman ps -a || true

            echo "### Container inspection"
            podman inspect webtester-app \
              --format 'PID={{.State.Pid}} Status={{.State.Status}} Running={{.State.Running}} Error={{.State.Error}}' \
              || true

            echo "### Container processes"
            podman top webtester-app || true

            echo "### Application logs"
            podman logs --tail 100 webtester-app || true

            echo "### Redis status"
            podman ps --filter name=webtester-redis || true

            echo "### Verify recorded host PID"
            APP_PID=$(podman inspect --format '{{.State.Pid}}' webtester-app 2>/dev/null || echo 0)
            echo "Recorded PID: $APP_PID"

            if [ "$APP_PID" -gt 0 ] 2>/dev/null; then
              ps -p "$APP_PID" -o pid,ppid,stat,args || true
              if [ -d "/proc/$APP_PID/ns" ]; then
                ls -l "/proc/$APP_PID/ns/mnt" || true
              else
                echo "Container PID or namespace is missing from /proc."
              fi
            fi

            echo "### Podman runtime information"
            podman info --debug

            exit 1
          fi

          echo "Webtester process and HTTP health check passed."
          podman ps --filter name=webtester-app

      - name: Show deployment summary
        if: success()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Deployment Summary"
            echo "- **Status:** Deployed successfully"
            echo "- **Version:** \`${VERSION}\`"
            echo "- **Time:** \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`"
          } >> "$GITHUB_STEP_SUMMARY"
